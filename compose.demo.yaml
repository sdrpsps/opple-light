name: opple-light-demo
services:
  light:
    image: opple-local:1.0.0
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${OPPLE_DEMO_PORT:-8086}:8080"
    environment:
      OPPLE_MODE: demo
      OPPLE_DEMO_OPEN: "1"
    volumes:
      - ./config/config.yaml:/config/config.yaml:ro
      - demo-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  demo-data:
