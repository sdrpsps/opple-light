[project]
name = "opple-light"
version = "1.0.0"
description = "Local OPPLE light control with a web UI and optional Pocket ID authentication"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "PyYAML>=6.0,<7",
    "pyoppleio-legacy==1.0.8",
    "httpx>=0.28,<1",
    "PyJWT[crypto]>=2.10,<3",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
