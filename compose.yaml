name: opple-light
services:
  light:
    image: opple-local:1.0.0
    build: .
    restart: unless-stopped
    init: true
    # Native Linux: the app sends and receives lamp UDP directly.
    network_mode: host
    environment:
      OPPLE_PUBLIC_URL: "${OPPLE_PUBLIC_URL:-}"
      OPPLE_OIDC_ISSUER: "${OPPLE_OIDC_ISSUER:-}"
      OPPLE_OIDC_CLIENT_ID: "${OPPLE_OIDC_CLIENT_ID:-}"
      OPPLE_OIDC_CLIENT_SECRET: "${OPPLE_OIDC_CLIENT_SECRET:-}"
      OPPLE_OIDC_RESOURCE: "${OPPLE_OIDC_RESOURCE:-}"
    volumes:
      - ./config/config.yaml:/config/config.yaml:ro
      - light-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  light-data:
